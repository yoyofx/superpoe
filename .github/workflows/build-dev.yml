name: Build Dev

# Fixed rolling channel: always publish/update the single pre-release at tag `dev`
# (Releases page: /releases/tag/dev). Local semver tags are not used for this channel.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: build-dev-channel
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve dev version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute rolling dev version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          # Strip any existing pre-release / build metadata so we always append one -dev.N
          base="${base%%-*}"
          base="${base%%+*}"
          short_sha="$(echo '${{ github.sha }}' | cut -c1-7)"
          # package.json / installer show: 0.5.0-dev.<run>.<sha>
          version="${base}-dev.${{ github.run_number }}.${short_sha}"
          {
            echo "version=${version}"
            echo "short_sha=${short_sha}"
            echo "commit_sha=${{ github.sha }}"
          } >> "${GITHUB_OUTPUT}"
          echo "Dev channel version=${version} commit=${{ github.sha }}"

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: win-x64
            electron_args: --win --x64
            artifact_name: superpoe2-dev-win-x64
          - os: macos-latest
            label: macOS
            electron_args: --mac
            artifact_name: superpoe2-dev-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply rolling dev version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          npm version "${version}" --no-git-tag-version --allow-same-version
          node -e "const p=require('./package.json'); if (p.version !== process.argv[1]) process.exit(1); console.log('package.json version =', p.version)" "${version}"

      - name: Run non-long unit tests
        run: npm run test:ci

      - name: Build Electron package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run build:electron
          npx electron-builder ${{ matrix.electron_args }} --publish never

      - name: Collect installer artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          shopt -s nullglob
          for f in release/*.{exe,dmg,zip,AppImage,blockmap,yml,yaml}; do
            if [[ -f "$f" ]]; then
              cp -a "$f" artifact/
            fi
          done
          if [[ -z "$(ls -A artifact 2>/dev/null || true)" ]]; then
            for f in release/*; do
              if [[ -f "$f" ]]; then
                cp -a "$f" artifact/
              fi
            done
          fi
          ls -la artifact
          test -n "$(ls -A artifact)"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish fixed Dev pre-release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          pattern: superpoe2-dev-*
          merge-multiple: true

      - name: List assets
        shell: bash
        run: |
          set -euo pipefail
          find dist-assets -type f | sort
          test -n "$(find dist-assets -type f | head -1)"

      - name: Create or refresh pre-release tag dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES="$(cat <<EOF
          ## SuperPoE2 Dev channel

          Rolling **pre-release** — always the latest successful build from the \`dev\` branch.

          | | |
          | --- | --- |
          | **Channel tag** | \`dev\` (fixed) |
          | **Build version** | \`${VERSION}\` |
          | **Commit** | \`${COMMIT_SHA}\` (\`${SHORT_SHA}\`) |
          | **Workflow run** | ${RUN_URL} |

          ### Notes
          - Not code-signed. Windows SmartScreen / macOS Gatekeeper may warn.
          - Each push to \`dev\` rebuilds and **replaces** assets on this release.
          - Stable releases use separately published version tags (not this page).
          EOF
          )"

          # Point lightweight tag `dev` at this commit (create or force-update).
          if gh api "repos/${{ github.repository }}/git/ref/tags/dev" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/dev" \
              -f sha="${COMMIT_SHA}" \
              -F force=true
          else
            gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/dev" \
              -f sha="${COMMIT_SHA}"
          fi

          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev \
              --title "SuperPoE2 Dev" \
              --prerelease \
              --latest=false \
              --target "${COMMIT_SHA}" \
              --notes "${NOTES}"

            # Drop previous channel assets so only the current build remains.
            mapfile -t old_assets < <(gh release view dev --json assets -q '.assets[].name' 2>/dev/null || true)
            for name in "${old_assets[@]+"${old_assets[@]}"}"; do
              [[ -n "${name}" ]] || continue
              gh release delete-asset dev "${name}" --yes
            done
          else
            gh release create dev \
              --title "SuperPoE2 Dev" \
              --prerelease \
              --latest=false \
              --target "${COMMIT_SHA}" \
              --notes "${NOTES}"
          fi

          # Upload current installers (names include rolling version).
          shopt -s nullglob
          files=(dist-assets/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No files under dist-assets/" >&2
            exit 1
          fi
          gh release upload dev "${files[@]}" --clobber

          echo "Dev channel updated: https://github.com/${{ github.repository }}/releases/tag/dev"
