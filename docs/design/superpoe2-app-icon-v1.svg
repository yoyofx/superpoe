<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f514c"/>
      <stop offset="0.18" stop-color="#171a18"/>
      <stop offset="0.52" stop-color="#343631"/>
      <stop offset="0.78" stop-color="#0b0d0c"/>
      <stop offset="1" stop-color="#55564e"/>
    </linearGradient>
    <linearGradient id="steelEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b897b"/>
      <stop offset="0.18" stop-color="#282b27"/>
