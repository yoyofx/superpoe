    <radialGradient id="core" cx="42%" cy="34%" r="76%">
      <stop offset="0" stop-color="#29443b"/>
      <stop offset="0.38" stop-color="#10241f"/>
      <stop offset="0.76" stop-color="#07100e"/>
      <stop offset="1" stop-color="#020504"/>
    </radialGradient>
    <radialGradient id="emerald" cx="38%" cy="30%" r="70%">
      <stop offset="0" stop-color="#d4ffe0"/>
      <stop offset="0.18" stop-color="#62e293"/>
      <stop offset="0.58" stop-color="#08724f"/>
      <stop offset="1" stop-color="#02271d"/>
    </radialGradient>
    <radialGradient id="ruby" cx="38%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffd1bd"/>
