      <stop offset="1" stop-color="#535349"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.16" stop-color="#d5ad54"/>
      <stop offset="0.48" stop-color="#76501f"/>
      <stop offset="0.72" stop-color="#c6953f"/>
      <stop offset="1" stop-color="#4a2d12"/>
